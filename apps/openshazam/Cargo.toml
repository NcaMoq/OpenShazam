[package]
name = "openshazam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["dev-cli"]
dev-cli = ["dep:ctrlc"]

[[bin]]
name = "openshazam"
path = "src/main.rs"

[dependencies]
sigx-core = { path = "../../crates/sigx-core" }
shazam-http-lab = { path = "../../crates/shazam-http-lab" }
shazam-progressive = { path = "../../crates/shazam-progressive" }
openshazam-controller = { path = "../../crates/openshazam-controller" }

[dev-dependencies]
sigx-format = { path = "../../crates/sigx-format" }

[target.'cfg(windows)'.dependencies]
wasapi = "0.25.0"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Globalization_DateTimeFormatting",
    "Foundation_Numerics",
    "Foundation",
    "ApplicationModel_Activation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Registry",
    "System",
    "Graphics",
    "Graphics_DirectX",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
] }
windows-numerics = "0.3.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ctrlc = { version = "3.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
