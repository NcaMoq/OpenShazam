[package]
name = "openshazam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sigx-core = { path = "../../crates/sigx-core" }
shazam-http-lab = { path = "../../crates/shazam-http-lab" }
shazam-progressive = { path = "../../crates/shazam-progressive" }
openshazam-controller = { path = "../../crates/openshazam-controller" }

[dev-dependencies]
sigx-format = { path = "../../crates/sigx-format" }

[target.'cfg(windows)'.dependencies]
wasapi = "0.25.0"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ctrlc = "3.4"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
