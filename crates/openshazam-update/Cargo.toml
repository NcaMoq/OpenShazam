[package]
name = "openshazam-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
zeroize = "1.8.1"

[[bin]]
name = "openshazam-update-tool"
path = "src/main.rs"
