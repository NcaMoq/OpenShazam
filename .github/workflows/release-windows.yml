name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify release tag is in main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/test_validate_release_version.py
          version="$(python3 tools/validate_release_version.py "$RELEASE_TAG")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Refuse release tags outside protected main
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo 'Release tag must point to a commit reachable from protected main.' >&2
            exit 1
          fi
      - name: Refuse duplicate releases before Windows validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          jq_filter=".[] | select(.tag_name == \"$RELEASE_TAG\") | .id"
          if ! existing_release_ids="$(gh api --paginate --jq "$jq_filter" "repos/$GITHUB_REPOSITORY/releases?per_page=100")"; then
            echo 'Could not safely inspect existing releases for this tag.' >&2
            exit 1
          fi
          if [[ -n "$existing_release_ids" ]]; then
            echo "A GitHub Release or draft already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi

  verify-release-secrets:
    name: Validate signing credentials before full Windows CI
    needs: verify-release-source
    runs-on: windows-latest
    timeout-minutes: 10
    environment: stable-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Authenticode certificate before full Windows CI
        shell: pwsh
        env:
          OPEN_SHAZAM_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_BASE64 }}
          OPEN_SHAZAM_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPEN_SHAZAM_SIGNING_CERTIFICATE_BASE64)) {
            throw 'Configure OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_BASE64 in the stable-release environment.'
          }
          if ([string]::IsNullOrWhiteSpace($env:OPEN_SHAZAM_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Configure OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_PASSWORD in the stable-release environment.'
          }
          .\tools\sign-windows-artifacts.ps1 -Path @() -RequireSignature -ValidateOnly
      - name: Require the Ed25519 release signing key
        shell: pwsh
        env:
          OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64)) {
            throw 'Configure OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64 as a repository secret.'
          }

  validate:
    needs: [verify-release-source, verify-release-secrets]
    name: Validate release commit
    uses: ./.github/workflows/ci.yml
    with:
      upload_release_inputs: true
    permissions:
      contents: read

  release:
    needs: [verify-release-source, verify-release-secrets, validate]
    name: Build and publish Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    environment: stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Shazam-Windows-x64-validation
          path: .
      - name: Verify the CI-validated Windows build inputs
        shell: pwsh
        run: |
          $requiredFiles = @(
            'dist/windows-x64/openshazam.exe',
            'dist/windows-x64/OpenShazam.SettingsHost.dll',
            'dist/windows-x64/THIRD-PARTY-NOTICES.txt',
            'dist/windows-x64/Microsoft.WindowsAppRuntime.Bootstrap.dll',
            'dist/windows-x64/OpenShazamSquare44.png',
            'dist/windows-x64/msvcp140.dll',
            'dist/windows-x64/vcruntime140.dll',
            'dist/windows-x64/vcruntime140_1.dll',
            'target/release/openshazam-update-tool.exe'
          )
          foreach ($relativePath in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $relativePath -PathType Leaf)) {
              throw "A required artifact from the validated Windows CI job is missing: $relativePath"
            }
          }
      - name: Require the Ed25519 release signing key
        shell: pwsh
        env:
          OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64)) {
            throw 'Configure the OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64 repository secret before creating a stable release.'
          }
      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'The GitHub token is required to safely inspect existing draft releases.'
          }
          $tag = $env:GITHUB_REF_NAME
          $jq = ".[] | select(.tag_name == `"$tag`" ) | .id"
          $existingReleaseIds = gh api --paginate --jq $jq "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not safely inspect existing releases for this tag.'
          }
          if (-not [string]::IsNullOrWhiteSpace(($existingReleaseIds -join ''))) {
            throw "A GitHub Release or draft already exists for $tag; refusing to replace it."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Prepare the Windows App SDK runtime prerequisite
        shell: pwsh
        run: .\tools\prepare-windows-app-sdk-runtime.ps1
      - name: Authenticode-sign application binaries
        shell: pwsh
        env:
          OPEN_SHAZAM_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_BASE64 }}
          OPEN_SHAZAM_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\tools\sign-windows-artifacts.ps1 -Path @('dist/windows-x64/openshazam.exe', 'dist/windows-x64/OpenShazam.SettingsHost.dll') -RequireSignature
      - name: Compile installer
        shell: pwsh
        env:
          OPEN_SHAZAM_VERSION: ${{ needs.verify-release-source.outputs.version }}
        run: .\tools\build-installer.ps1 -Version $env:OPEN_SHAZAM_VERSION
      - name: Authenticode-sign installer
        shell: pwsh
        env:
          OPEN_SHAZAM_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_BASE64 }}
          OPEN_SHAZAM_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OPEN_SHAZAM_RELEASE_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\tools\sign-windows-artifacts.ps1 -Path "dist/windows-x64/Shazam-Setup-${{ needs.verify-release-source.outputs.version }}-x64.exe" -RequireSignature
      - name: Sign and verify the update manifest and installer hash
        shell: pwsh
        env:
          OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.OPEN_SHAZAM_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          .\tools\prepare-release-update.ps1 -Version '${{ needs.verify-release-source.outputs.version }}' -MinimumSupportedVersion '0.1.0' -UseValidatedUpdateTool
      - name: Create isolated draft release
        id: create_draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: Shazam ${{ needs.verify-release-source.outputs.version }}
        run: |
          $draftJson = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" `
            --field "tag_name=$env:GITHUB_REF_NAME" `
            --field "name=$env:RELEASE_NAME" `
            --field "target_commitish=$env:GITHUB_SHA" `
            --field 'body=' `
            --field draft=true `
            --field prerelease=false `
            --raw-field make_latest=false
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create a new draft release. No existing release will be modified.'
          }
          $draft = $draftJson | ConvertFrom-Json
          if ($null -eq $draft.id -or "$($draft.id)" -notmatch '^\d+$') {
            throw 'GitHub did not return a valid draft release ID; refusing to continue without a safe cleanup handle.'
          }
          "release_id=$($draft.id)" >> $env:GITHUB_OUTPUT
          if ($draft.tag_name -cne $env:GITHUB_REF_NAME -or
              $draft.name -cne $env:RELEASE_NAME -or
              $draft.draft -ne $true) {
            throw 'GitHub returned a draft release that did not match the requested tag, name, and draft state.'
          }
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Shazam ${{ needs.verify-release-source.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/windows-x64/Shazam-Setup-${{ needs.verify-release-source.outputs.version }}-x64.exe
            dist/windows-x64/Shazam-Setup-${{ needs.verify-release-source.outputs.version }}-x64.exe.sha256
            dist/windows-x64/OpenShazam-update.json
            dist/windows-x64/OpenShazam-update.json.sig
      - name: Download and verify the uploaded draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\verify-release-assets.ps1 -Version '${{ needs.verify-release-source.outputs.version }}' -MinimumSupportedVersion '0.1.0'
      - name: Publish the verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit '${{ github.ref_name }}' --repo $env:GITHUB_REPOSITORY --draft=false --latest --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified GitHub Release.' }
      - name: Remove incomplete draft created by this workflow
        if: ${{ (failure() || cancelled()) && steps.create_draft.outputs.release_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_draft.outputs.release_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: Shazam ${{ needs.verify-release-source.outputs.version }}
        run: |
          if ($env:RELEASE_ID -notmatch '^\d+$') {
            throw 'Refusing draft cleanup because the captured release ID is invalid.'
          }
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the captured release before cleanup.'
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.id -ne [long]$env:RELEASE_ID -or
              $release.tag_name -cne $env:RELEASE_TAG -or
              $release.name -cne $env:RELEASE_NAME -or
              $release.draft -ne $true) {
            throw 'Refusing to remove a release that no longer matches this workflow-created draft.'
          }
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the incomplete workflow-created draft.' }
