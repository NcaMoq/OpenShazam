name: OpenShazam CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR push already runs this workflow; cancel superseded revisions instead of
# consuming runners for commits which can no longer be merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Match rust-toolchain.toml; installing stable components does not
          # install them for the repository's pinned Rust 1.85.0 toolchain.
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - run: cargo test --workspace --all-targets --locked
      - name: Check production libraries without developer CLI feature
        run: cargo check --workspace --all-targets --locked --no-default-features
      - name: Verify Windows packet-to-SigX golden fixture
        if: runner.os == 'Windows'
        run: cargo test -p openshazam --locked packetized_capture_matches_single_packet_and_is_repeatable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-gnu-cross-check:
    name: Windows GNU target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          targets: x86_64-pc-windows-gnu
      - run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-gnu

  winui:
    name: WinUI 3 desktop and Rust recognition bundle (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WinUI 3 desktop and Rust sidecar
        shell: pwsh
        run: ./tools/build-winui.ps1
      - name: Smoke-test recognition bridge startup and shutdown
        shell: pwsh
        run: |
          $reply = '{"command":"shutdown"}' | & ".\dist\win-x64\openshazam-ui-bridge.exe"
          if ($LASTEXITCODE -ne 0) { throw "Rust bridge failed to exit cleanly" }
          if (-not ($reply | Select-String -SimpleMatch 'openshazam.bridge.v1')) {
            throw "Rust bridge did not emit the expected protocol handshake"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenShazam-WinUI3-win-x64-unsigned
          path: dist/win-x64/
          if-no-files-found: error
