name: OpenShazam Windows CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Check production libraries without developer CLI feature
        run: cargo check --workspace --all-targets --locked --no-default-features
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check Windows release and update security contract
        shell: pwsh
        run: .\tools\test-windows-installer-contract.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.3 --yes --no-progress
      - name: Prepare the fixed runtime output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path dist/windows-x64 -Force | Out-Null
      - name: Build the unpackaged Windows application
        shell: pwsh
        run: .\tools\build-windows.ps1 -Product
      - name: Prepare the Windows App SDK runtime prerequisite
        shell: pwsh
        run: .\tools\prepare-windows-app-sdk-runtime.ps1
      - name: Compile the per-user installer
        shell: pwsh
        run: |
          $workspace = Get-Content -LiteralPath Cargo.toml -Raw
          $package = [regex]::Match($workspace, '(?ms)^\[workspace\.package\]\s*(?<section>.*?)(?=^\[|\z)')
          if (-not $package.Success) { throw 'Cargo.toml is missing [workspace.package].' }
          $version = [regex]::Match($package.Groups['section'].Value, '(?m)^version\s*=\s*"(?<value>\d+\.\d+\.\d+)"')
          if (-not $version.Success) { throw 'Cargo workspace version is missing or invalid.' }
          $env:OPEN_SHAZAM_VERSION = $version.Groups['value'].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler is missing: $iscc" }
          & $iscc /Qp installer\OpenShazam.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          $installer = Join-Path $PWD "dist\windows-x64\Shazam-Setup-$env:OPEN_SHAZAM_VERSION-x64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'The installer was not produced.' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$installer.sha256", "$hash *$(Split-Path -Leaf $installer)`n", [Text.UTF8Encoding]::new($false))
      - name: Verify installer checksum sidecar
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows-x64 -Filter 'Shazam-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The Inno Setup installer was not produced.' }
          $sidecar = Get-Content -LiteralPath "$($installer.FullName).sha256" -Raw
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $sidecar.StartsWith($actual, [StringComparison]::Ordinal)) { throw 'The installer SHA-256 sidecar does not match the executable.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Shazam-Windows-x64-validation
          path: |
            dist/windows-x64/Shazam-Setup-*-x64.exe
            dist/windows-x64/Shazam-Setup-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 3
